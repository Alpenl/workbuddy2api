services:
  wb2api:
    image: ${WB2A_IMAGE:-ghcr.io/alpenl/workbuddy2api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workbuddy2api
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WB2A_PORT:-7863}:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
